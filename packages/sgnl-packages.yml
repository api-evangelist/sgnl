notes: >-
  First-party open-source libraries published by the SGNL-ai GitHub organization.
  These implement the CAEP / Shared Signals Framework (SSF) and Security Event Token
  (RFC 8417) standards SGNL builds on, plus tooling for its ingestion adapters. They
  are not thin generated clients of the SGNL Public API v2 (which has no published
  generated SDK), but they are genuinely first-party and developer-facing.
