name: SGNL
description: >-
  SGNL is a continuous identity and authorization platform that eliminates standing
  privilege and makes real-time, context-aware access decisions for both human users
  and AI agents. It sits at the center of an enterprise IAM architecture, dynamically
  adapting permissions as conditions change and revoking sessions in real time. SGNL
  is built on the OpenID Shared Signals Framework (SSF) and the Continuous Access
  Evaluation Profile (CAEP), ingesting context from identity providers, HR systems,
  and security tooling to enforce zero standing privilege across cloud and
  infrastructure. Its Public API v2 (Access Service) exposes REST/JSON access
  evaluation, asset and principal search, directory query, and provider-hook routing.
